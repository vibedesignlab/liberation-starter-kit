<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">MORA Batch Record Label Master</title>
  <desc id="desc">Strict-front partial uncoated paper food batch record with fixed process fields and a limited maker-check area.</desc>
  <defs>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0d0d0c" flood-opacity="0.34"/>
    </filter>
    <filter id="paperGrain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="23" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 0.13"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>
    <clipPath id="paperClip">
      <path d="M304 212 L1230 209 L1236 827 L302 833 Z"/>
    </clipPath>
    <style>
      .sans { font-family: "Helvetica Neue", Arial, sans-serif; fill: #161715; }
      .brand { font-size: 42px; font-weight: 700; letter-spacing: 7px; }
      .title { font-size: 17px; font-weight: 700; letter-spacing: 2.8px; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: 1.8px; }
      .value { font-size: 27px; font-weight: 600; letter-spacing: 0.6px; }
      .meta { font-size: 12px; font-weight: 600; letter-spacing: 1.4px; }
      .micro { font-size: 10px; font-weight: 600; letter-spacing: 1.1px; }
      .rule { stroke: #272824; stroke-width: 2; }
      .hairline { stroke: #373832; stroke-width: 1.2; }
      .blank { stroke: #4d4e47; stroke-width: 1.4; stroke-dasharray: 2 5; }
    </style>
  </defs>

  <rect width="1536" height="1024" fill="#232522"/>
  <rect x="0" y="0" width="1536" height="1024" fill="#111210" opacity="0.16"/>

  <path d="M304 212 L1230 209 L1236 827 L302 833 Z" fill="#c9bda5" filter="url(#paperShadow)"/>
  <g clip-path="url(#paperClip)">
    <rect x="294" y="202" width="952" height="642" fill="#c9bda5" filter="url(#paperGrain)"/>
    <path d="M304 212 L1230 209 L1236 827 L302 833 Z" fill="none" stroke="#a99e88" stroke-width="2"/>

    <g class="sans">
      <text x="360" y="278" class="brand">MORA</text>
      <text x="1175" y="258" text-anchor="end" class="title">BATCH RECORD</text>
      <text x="1175" y="283" text-anchor="end" class="micro">FOOD PROCESS / PARTIAL JAR LABEL</text>

      <line x1="360" y1="315" x2="1175" y2="315" class="rule"/>

      <text x="360" y="354" class="label">RECIPE</text>
      <text x="360" y="394" class="value">THYME HONEY</text>
      <text x="982" y="354" class="label">NET WT</text>
      <text x="982" y="392" class="value">150 g</text>
      <text x="1175" y="354" text-anchor="end" class="label">KEEP COLD</text>
      <text x="1175" y="390" text-anchor="end" class="value">0–4°C</text>

      <line x1="360" y1="425" x2="1175" y2="425" class="hairline"/>

      <g>
        <text x="360" y="467" class="label">BATCH</text>
        <line x1="500" y1="470" x2="720" y2="470" class="blank"/>
        <text x="360" y="516" class="label">MILK LOT</text>
        <line x1="500" y1="519" x2="720" y2="519" class="blank"/>
        <text x="360" y="565" class="label">CULTURED</text>
        <line x1="500" y1="568" x2="720" y2="568" class="blank"/>
        <text x="360" y="614" class="label">STRAINED</text>
        <line x1="500" y1="617" x2="720" y2="617" class="blank"/>
        <text x="360" y="663" class="label">FOLDED</text>
        <line x1="500" y1="666" x2="720" y2="666" class="blank"/>
        <text x="360" y="712" class="label">PACKED</text>
        <line x1="500" y1="715" x2="720" y2="715" class="blank"/>
      </g>

      <line x1="780" y1="451" x2="780" y2="726" class="hairline"/>

      <text x="824" y="467" class="title">MAKER CHECK</text>
      <text x="824" y="510" class="label">INITIALS</text>
      <line x1="957" y1="513" x2="1138" y2="513" class="blank"/>
      <text x="824" y="560" class="label">FINAL CHECK</text>
      <circle cx="982" cy="555" r="13" fill="none" class="hairline"/>
      <path d="M973 555 L980 562 L992 547" fill="none" stroke="#373832" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1007" y="560" class="micro">PASS</text>
      <circle cx="1080" cy="555" r="13" fill="none" class="hairline"/>
      <text x="1105" y="560" class="micro">HOLD</text>
      <text x="982" y="585" text-anchor="middle" class="micro">REFERENCE MARK</text>
      <text x="824" y="612" class="label">BATCH CONDITION</text>
      <line x1="824" y1="645" x2="1138" y2="645" class="blank"/>
      <line x1="824" y1="684" x2="1138" y2="684" class="blank"/>
      <text x="824" y="715" class="micro">HAND MARKS ONLY AFTER AN ACCOUNTABLE LIVE CHECK</text>

      <line x1="360" y1="758" x2="1175" y2="758" class="rule"/>
      <text x="360" y="790" class="micro">CONCEPT MASTER — FIELD VALUES REQUIRE R&amp;D / OPERATIONS / LEGAL VALIDATION</text>
      <text x="1175" y="790" text-anchor="end" class="micro">UNCOATED STOCK / MAX 30–40% JAR COVERAGE</text>
    </g>
  </g>
</svg>

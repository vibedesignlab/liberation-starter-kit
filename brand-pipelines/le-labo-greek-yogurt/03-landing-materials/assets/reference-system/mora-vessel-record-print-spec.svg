<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1536" viewBox="0 0 1536 1536" role="img" aria-labelledby="title desc">
  <title id="title">MORA Vessel Record print and form specification</title>
  <desc id="desc">A warm-cream technical specification sheet showing the front elevation, directional dimensions, exact direct-print record column, and rear Material Plate micro-mark for the MORA Thyme Honey glass vessel.</desc>
  <defs>
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.16" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#D8D2C8" stop-opacity="0.10"/>
      <stop offset="0.82" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A8A197" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="capFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#302F2C"/>
      <stop offset="0.25" stop-color="#4A4945"/>
      <stop offset="0.72" stop-color="#242421"/>
      <stop offset="1" stop-color="#3B3A36"/>
    </linearGradient>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="3" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M10 0 L0 5 L10 10" fill="none" stroke="#171714" stroke-width="1"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#171714" stroke-width="1"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; fill: #171714; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; fill: #171714; }
      .hair { stroke: #171714; stroke-width: 1; fill: none; vector-effect: non-scaling-stroke; }
      .fine { stroke: #171714; stroke-width: 0.5; fill: none; vector-effect: non-scaling-stroke; }
      .muted { fill: #615F59; }
      .ghost { stroke: #171714; stroke-opacity: 0.18; fill: none; }
      .small { font-size: 12px; letter-spacing: 1.7px; }
      .micro { font-size: 9px; letter-spacing: 1.25px; }
      .label { font-size: 10px; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect width="1536" height="1536" fill="#F5F1E8"/>

  <!-- Header -->
  <text x="96" y="72" class="mono small">MORA / PACKAGING SYSTEM / REV 03</text>
  <text x="96" y="116" class="sans" font-size="38" font-weight="600" letter-spacing="-0.6">MORA VESSEL RECORD</text>
  <text x="1440" y="72" class="mono small" text-anchor="end">ST3–25 / 1536 × 1536</text>
  <text x="1440" y="112" class="mono" font-size="14" letter-spacing="2" text-anchor="end">PRINT &amp; FORM SPECIFICATION</text>
  <line x1="96" y1="144" x2="1440" y2="144" class="hair"/>

  <!-- Section labels -->
  <text x="96" y="190" class="mono small">01 / FRONT ELEVATION</text>
  <text x="920" y="190" class="mono small">02 / DIRECT-PRINT AUTHORITY</text>
  <line x1="96" y1="205" x2="840" y2="205" class="fine"/>
  <line x1="920" y1="205" x2="1440" y2="205" class="fine"/>

  <!-- Directional vessel elevation: 70 mm body / 110 mm total -->
  <line x1="520" y1="250" x2="520" y2="1034" class="ghost" stroke-dasharray="4 8"/>
  <rect x="350" y="300" width="340" height="62" rx="18" fill="url(#capFill)" stroke="#171714" stroke-width="1"/>
  <path d="M344 358 L344 382 C344 402 321 418 304 431 C296 438 294 448 294 462 L294 930 C294 969 316 993 345 993 L695 993 C724 993 746 969 746 930 L746 462 C746 448 744 438 736 431 C719 418 696 402 696 382 L696 358 Z" fill="url(#glassFill)" stroke="#171714" stroke-width="1.4"/>
  <path d="M344 358 C390 369 650 369 696 358" class="hair" opacity="0.56"/>
  <path d="M365 382 C401 392 639 392 675 382" class="fine" opacity="0.56"/>
  <path d="M294 930 C385 947 655 947 746 930 L746 950 C724 978 316 978 294 950 Z" fill="#FFFFFF" fill-opacity="0.18" stroke="#171714" stroke-width="0.8"/>
  <path d="M324 956 C394 967 646 967 716 956" class="fine" opacity="0.6"/>

  <!-- Yogurt and trace indication -->
  <path d="M309 467 C404 458 636 458 731 467 L731 920 C628 932 412 932 309 920 Z" fill="#FFFFFF" fill-opacity="0.28"/>
  <path d="M676 476 C622 536 606 599 650 650 C690 696 663 781 604 847" stroke="#A97B37" stroke-opacity="0.25" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Exact direct-print record column on vessel -->
  <line x1="358" y1="526" x2="358" y2="814" stroke="#171714" stroke-width="0.5"/>
  <text x="380" y="548" class="sans" font-size="14" font-weight="600" letter-spacing="3">MORA</text>
  <text x="380" y="584" class="sans" font-size="23" font-weight="700" letter-spacing="0.6">THYME HONEY / 01</text>
  <text x="380" y="610" class="mono" font-size="10" letter-spacing="1.3">INFUSED GREEK YOGURT</text>
  <line x1="380" y1="625" x2="648" y2="625" class="fine"/>
  <text x="380" y="650" class="mono label">PREP</text>
  <text x="442" y="650" class="mono" font-size="11" letter-spacing="0.6">HONEY–THYME SYRUP</text>
  <line x1="380" y1="664" x2="648" y2="664" class="fine"/>
  <text x="380" y="689" class="mono label">TRACE</text>
  <text x="442" y="689" class="mono" font-size="11" letter-spacing="0.6">AMBER RIBBON</text>
  <line x1="380" y1="703" x2="648" y2="703" class="fine"/>
  <text x="380" y="730" class="mono" font-size="13" letter-spacing="1">150 g</text>
  <text x="380" y="768" class="mono label">BATCH</text>
  <text x="442" y="768" class="mono" font-size="12" letter-spacing="1">24A01</text>
  <text x="380" y="795" class="mono micro muted">SAMPLE FORMAT / VERIFIED LOT ONLY</text>

  <!-- Dimension lines -->
  <line x1="254" y1="300" x2="254" y2="993" class="hair" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <line x1="266" y1="300" x2="344" y2="300" class="fine"/>
  <line x1="266" y1="993" x2="344" y2="993" class="fine"/>
  <text x="228" y="646" class="mono" font-size="12" letter-spacing="1.4" text-anchor="middle" transform="rotate(-90 228 646)">110 mm / TOTAL HEIGHT</text>

  <line x1="294" y1="1030" x2="746" y2="1030" class="hair" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <line x1="294" y1="1004" x2="294" y2="1042" class="fine"/>
  <line x1="746" y1="1004" x2="746" y2="1042" class="fine"/>
  <text x="520" y="1062" class="mono" font-size="12" letter-spacing="1.4" text-anchor="middle">70 mm / BODY DIAMETER</text>

  <line x1="344" y1="408" x2="696" y2="408" class="hair" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="520" y="397" class="mono micro" text-anchor="middle">55 mm / WIDE MOUTH</text>

  <path d="M772 382 L790 382 L790 462 L772 462" class="hair"/>
  <text x="804" y="418" class="mono micro">SHOULDER</text>
  <text x="804" y="434" class="mono micro">14% H</text>
  <path d="M772 930 L790 930 L790 993 L772 993" class="hair"/>
  <text x="804" y="956" class="mono micro">HEAVY BASE</text>
  <text x="804" y="972" class="mono micro">9% H</text>

  <text x="96" y="1112" class="mono micro muted">DIRECTIONAL FORM ONLY / 68–72 mm BODY / 105–115 mm HEIGHT / VERIFY WITH GLASS &amp; CLOSURE SUPPLIERS</text>

  <!-- Enlarged exact print hierarchy -->
  <line x1="955" y1="250" x2="955" y2="700" stroke="#171714" stroke-width="0.5"/>
  <text x="988" y="280" class="sans" font-size="18" font-weight="600" letter-spacing="4">MORA</text>
  <text x="988" y="330" class="sans" font-size="36" font-weight="700" letter-spacing="0.5">THYME HONEY / 01</text>
  <text x="988" y="365" class="mono" font-size="14" letter-spacing="2">INFUSED GREEK YOGURT</text>
  <line x1="988" y1="388" x2="1398" y2="388" class="fine"/>
  <text x="988" y="424" class="mono" font-size="12" letter-spacing="2">PREP</text>
  <text x="1088" y="424" class="mono" font-size="15" letter-spacing="0.8">HONEY–THYME SYRUP</text>
  <line x1="988" y1="448" x2="1398" y2="448" class="fine"/>
  <text x="988" y="484" class="mono" font-size="12" letter-spacing="2">TRACE</text>
  <text x="1088" y="484" class="mono" font-size="15" letter-spacing="0.8">AMBER RIBBON</text>
  <line x1="988" y1="508" x2="1398" y2="508" class="fine"/>
  <text x="988" y="553" class="mono" font-size="18" letter-spacing="1.6">150 g</text>
  <text x="988" y="606" class="mono" font-size="12" letter-spacing="2">BATCH</text>
  <text x="1088" y="606" class="mono" font-size="18" letter-spacing="2">24A01</text>
  <text x="988" y="640" class="mono micro muted">SAMPLE BATCH-FORMAT TOKEN</text>
  <text x="988" y="658" class="mono micro muted">REPLACE WITH VERIFIED LOT CODE BEFORE PRODUCTION</text>
  <text x="988" y="698" class="mono micro muted">ONE 0.5 pt VERTICAL RULE / SHORT FUNCTIONAL BASELINES / NO ENCLOSING GRID</text>

  <!-- Print construction notes -->
  <line x1="920" y1="748" x2="1440" y2="748" class="fine"/>
  <text x="920" y="778" class="mono small">PRINT CONSTRUCTION</text>
  <circle cx="934" cy="820" r="7" fill="#171714"/>
  <text x="956" y="824" class="mono" font-size="12" letter-spacing="1.2">01 INK / RECORD BLACK #171714</text>
  <line x1="927" y1="858" x2="941" y2="858" stroke="#171714" stroke-width="0.5"/>
  <text x="956" y="862" class="mono" font-size="12" letter-spacing="1.2">0.5 pt RULE / DIRECT ON CLEAR GLASS</text>
  <rect x="927" y="891" width="14" height="14" fill="none" stroke="#171714" stroke-width="1"/>
  <line x1="928" y1="892" x2="940" y2="904" class="fine"/>
  <line x1="940" y1="892" x2="928" y2="904" class="fine"/>
  <text x="956" y="903" class="mono" font-size="12" letter-spacing="1.2">NO PAPER / NO OPAQUE BACKING</text>

  <!-- Rear Material Plate micro-mark -->
  <line x1="920" y1="950" x2="1440" y2="950" class="fine"/>
  <text x="920" y="982" class="mono small">03 / REAR MATERIAL PLATE MICRO-MARK</text>
  <circle cx="1020" cy="1070" r="62" fill="none" stroke="#171714" stroke-width="1"/>
  <circle cx="1020" cy="1070" r="51" fill="none" stroke="#171714" stroke-width="0.5"/>
  <path d="M986 1090 C1001 1072 1016 1054 1049 1044" class="hair"/>
  <path d="M1004 1070 C992 1064 986 1055 982 1046 M1019 1059 C1010 1049 1008 1040 1009 1032 M1033 1052 C1034 1040 1040 1033 1048 1027" class="fine"/>
  <path d="M1034 1087 C1046 1076 1055 1079 1057 1090 C1058 1102 1048 1110 1038 1105 C1028 1101 1026 1094 1034 1087 Z" fill="#171714" fill-opacity="0.12" stroke="#171714" stroke-width="0.7"/>
  <line x1="1102" y1="1010" x2="1102" y2="1132" class="hair" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="1122" y="1066" class="mono" font-size="12" letter-spacing="1.2">16 mm</text>
  <text x="1122" y="1086" class="mono micro muted">REAR LOWER / RECIPE-SPECIFIC</text>
  <text x="1122" y="1104" class="mono micro muted">FULL EDITORIAL ENGRAVING STAYS OFF FRONT</text>
  <text x="1122" y="1122" class="mono micro muted">MICRO-MARK MAY BE OMITTED IN PRIMARY PHOTO</text>

  <!-- Production and boundary footer -->
  <line x1="96" y1="1192" x2="1440" y2="1192" class="hair"/>
  <text x="96" y="1230" class="mono small">04 / PRODUCTION GATES</text>

  <text x="96" y="1270" class="mono micro muted">FORM</text>
  <text x="96" y="1292" class="mono" font-size="11">OPTICALLY CLEAR HEAVY GLASS CANDIDATE</text>
  <text x="96" y="1312" class="mono" font-size="11">LOW GRAPHITE METAL OVERCAP / WIDE FOOD MOUTH</text>
  <text x="96" y="1332" class="mono" font-size="11">NO FOOD-CONTACT OR PERFORMANCE CLAIM</text>

  <text x="536" y="1270" class="mono micro muted">PRINT</text>
  <text x="536" y="1292" class="mono" font-size="11">ONE NEUTRAL-BLACK DIRECT PRINT / CLEAR GLASS</text>
  <text x="536" y="1312" class="mono" font-size="11">PRODUCT NAME LEADS / MORA IS SUBORDINATE</text>
  <text x="536" y="1332" class="mono" font-size="11">ACTUAL REGULATORY DATA REQUIRES SEPARATE REVIEW</text>

  <text x="988" y="1270" class="mono micro muted">SOURCE-DISTANCE BOUNDARY</text>
  <text x="988" y="1292" class="mono" font-size="11">NO SOURCE-BRAND WORDING OR PAPER LABEL</text>
  <text x="988" y="1312" class="mono" font-size="11">NO SCENT-NUMBER NAMING / CITY / NAME / DATE</text>
  <text x="988" y="1332" class="mono" font-size="11">SYSTEM LOGIC TRANSLATED FOR MORA CULTURED FOOD</text>

  <line x1="96" y1="1384" x2="1440" y2="1384" class="fine"/>
  <text x="96" y="1422" class="mono micro muted">DIRECTIONAL DESIGN SPECIFICATION / VERIFY DIMENSIONS, PRINT ADHESION, FILL LINE, CLOSURE, FOOD-CONTACT MATERIALS &amp; REGULATORY COPY WITH QUALIFIED SUPPLIERS.</text>
  <text x="96" y="1462" class="mono micro muted">BATCH TOKEN 24A01 IS A VISUAL FORMAT EXAMPLE ONLY. NEVER SHIP WITHOUT A VERIFIED LOT CODE.</text>
  <text x="1440" y="1462" class="mono micro muted" text-anchor="end">MORA / VESSEL RECORD / STAGE 3 REVISION 03</text>
</svg>
